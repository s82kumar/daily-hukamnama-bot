name: Daily Hukamnama TikTok Generator

on:
  schedule:
    - cron: '30 1 * * *' # Runs daily at 7:00 AM IST (1:30 AM UTC)
  workflow_dispatch: # Allows you to click "Run workflow" manually to test

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ImageMagick & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml
          pip install requests edge-tts google-genai moviepy==1.0.3

      - name: Run Hukamnama Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_video.py

      - name: Upload Finished TikTok Video
        uses: actions/upload-artifact@v4
        with:
          name: daily-hukamnama-video
          path: daily_hukamnama.mp4
